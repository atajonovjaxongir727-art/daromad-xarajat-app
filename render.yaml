services:
  - type: web
    name: moliya-boshqaruvi
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build && npm run db:seed
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        value: file:./dev.db
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
